<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Verify your Class Attendance account</title></head>
  <body style="font-family:Arial,sans-serif;color:#102235;padding:24px;line-height:1.6">
    <h1>Verify your email</h1>
    <p>Enter this code in the Class Attendance app to confirm your account:</p>
    <p style="font-size:32px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
    <p>Use the latest code you received. If it expires, request a new code in the app.</p>
    <p>If you did not create this account, you can ignore this email.</p>
  </body>
</html>
